{{- $replicas := int .Values.replicas }}
{{- if le $replicas 0 }}
{{- fail "replicas must be greater than zero" }}
{{- end }}

{{- if not .Values.secretName }}
{{- fail "secretName is empty" }}
{{- end }}

{{- $hosts := .Values.hosts }}
{{- $hostsLen := len $hosts }}
{{- range $i := until $replicas }}
  {{- $start := div (mul $i $hostsLen) $replicas }}
  {{- $end := div (mul (add $i 1) $hostsLen) $replicas }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: http-load-generator-hosts-{{ $i }}
data:
  hosts.json: |
    {{- toPrettyJson (default list (slice $hosts $start $end)) | nindent 4 }}
---
apiVersion: v1
kind: Pod
metadata:
  name: http-load-generator-{{ $i }}
  labels:
    app: http-load-generator
    instance: "{{ $i }}"
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: http-load-generator
        topologyKey: kubernetes.io/hostname
      - labelSelector:
          matchLabels:
            cluster: kafka
        topologyKey: kubernetes.io/hostname
  volumes:
    - name: creds-key
      secret:
        secretName: creds-key
        items:
          - key: creds-key
            path: creds-key
    - name: hosts
      configMap:
        name: http-load-generator-hosts-{{ $i }}
    - name: credentials
      emptyDir: {}
  initContainers:
    - name: setup-credentials
      image: alpine:3.20
      command:
        - /bin/sh
        - -ec
        - |
          apk add --no-cache wget openssl unzip
          wget -q -O /tmp/creds.zip.enc \
            https://github.com/landaudiogo/cec-infrastructure/raw/refs/heads/master/nixos/secrets/creds.zip.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/creds.zip.enc -out /tmp/creds.zip \
            -pass file:/etc/secrets/creds-key
          unzip -o /tmp/creds.zip -d /tmp/credentials
          mv /tmp/credentials/creds/admins/landau/* /etc/credentials
      volumeMounts:
        - name: credentials
          mountPath: /etc/credentials
        - name: creds-key
          mountPath: /etc/secrets
          readOnly: true
  containers:
    - name: http-load-generator
      resources:
        requests:
          cpu: 1000m
          memory: 500Mi
      image: {{ $.Values.image.repository }}:{{ default $.Chart.AppVersion $.Values.image.tag }}
      ports:
      - name: metrics
        containerPort: 3002
      args:
        - --brokers
        - "kafka-1:9094,kafka-2:9094,kafka-3:9094"
        - --topic
        - "experiment-document"
        - --consumer-wait-before-send
        - "60"
        - --hosts-file
        - /etc/http-load-generator/hosts.json
        - --requestor-lag
        - "5"
        - --requestor-retries
        - "0"
        - --requestor-max-in-flight
        - "80"
        - --stable-rate-duration
        - "60"
      env:
        - name: RUST_LOG
          value: {{ $.Values.env.RUST_LOG }}
        - name: GENERATION_BATCHES
          valueFrom:
            secretKeyRef: { name: {{ $.Values.secretName }}, key: GENERATION_BATCHES }
      volumeMounts:
        - name: credentials
          mountPath: /auth
        - name: hosts
          mountPath: /etc/http-load-generator/
{{- end }}
